name: Update haze data

on:
  schedule:
    - cron: "10 * * * *"   # every hour, at 10 minutes past
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest PSI
        run: python scripts/fetch_psi.py
      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update haze data"
                    git pull --rebase
          git push
